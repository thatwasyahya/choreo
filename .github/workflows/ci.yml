name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GOLANGCI_VERSION: "2.13.2"

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks walks the history, so a shallow clone would hide a leak
          # introduced two commits ago.
          fetch-depth: 0

      # Downloaded rather than pulled in as a third-party action: one less
      # workflow with access to this repository.
      - name: Scan the history
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --exit-code 1

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test -race ./...

      - name: Lint
        working-directory: server
        run: |
          curl -fsSL -o golangci.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}/golangci-lint-${GOLANGCI_VERSION}-linux-amd64.tar.gz"
          tar -xzf golangci.tar.gz
          "./golangci-lint-${GOLANGCI_VERSION}-linux-amd64/golangci-lint" run

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate
        working-directory: app
        # Generated code is not committed, so it has to be rebuilt here.
        # --force-jit is required: build_runner AOT-compiles its build script
        # with `dart compile`, which refuses packages carrying a native build
        # hook — and sqlite3, under drift, carries one.
        run: dart run build_runner build --force-jit --delete-conflicting-outputs

      - name: Analyse
        working-directory: app
        # Warnings fail the build: an ignored warning becomes a permanent one.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build a debug APK
        working-directory: app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: choreo-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
