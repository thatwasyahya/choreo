name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GOLANGCI_VERSION: "2.13.2"

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks walks the history, so a shallow clone would hide a leak
          # introduced two commits ago.
          fetch-depth: 0

      # Downloaded rather than pulled in as a third-party action: one less
      # workflow with access to this repository.
      - name: Scan the history
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --exit-code 1

  server:
    name: Server
    runs-on: ubuntu-latest

    # Without a database the store and API tests SKIP, and a green run would
    # mean nothing at all for the part of the server that holds the data.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: choreo
          POSTGRES_PASSWORD: choreo
          POSTGRES_DB: choreo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U choreo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        # -p 1: packages share one test database and truncate between tests,
        # so they must not run at the same time.
        run: go test -race -p 1 ./...
        env:
          CHOREO_TEST_DATABASE_URL: postgres://choreo:choreo@localhost:5432/choreo_test?sslmode=disable

      - name: Lint
        working-directory: server
        run: |
          curl -fsSL -o golangci.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}/golangci-lint-${GOLANGCI_VERSION}-linux-amd64.tar.gz"
          tar -xzf golangci.tar.gz
          "./golangci-lint-${GOLANGCI_VERSION}-linux-amd64/golangci-lint" run

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          # PINNED, and not "whatever stable is today". The analyser ships with
          # the SDK, and `--fatal-infos` makes every lint it adds a failure: an
          # unpinned channel turns somebody else's release into our red build,
          # on a commit that changed nothing. It cost this project its first CI
          # run. Moving this is a deliberate task with its own commit, and the
          # development machine moves with it.
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate
        working-directory: app
        # Generated code is not committed, so it has to be rebuilt here.
        # --force-jit is required: build_runner AOT-compiles its build script
        # with `dart compile`, which refuses packages carrying a native build
        # hook — and sqlite3, under drift, carries one.
        run: dart run build_runner build --force-jit

      - name: Analyse
        working-directory: app
        # Warnings fail the build: an ignored warning becomes a permanent one.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        working-directory: app
        # Golden images are excluded: they are a photograph of one machine's
        # text rasteriser, and the comparison is exact, so they fail on every
        # machine that did not record them. A test that is red everywhere
        # teaches people to ignore a red build. They stay a local design tool —
        # `flutter test test/design --update-goldens`, then look at the images.
        run: flutter test --exclude-tags golden

      - name: Build a debug APK
        working-directory: app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: choreo-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
