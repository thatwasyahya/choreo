name: choreo

# The development stack: PostgreSQL and the server, nothing else.
#
# The reverse proxy lives in compose.prod.yaml rather than behind a profile.
# Compose interpolates variables for EVERY service when it parses the file,
# including services in a profile that is not active — so a `${VAR:?}` meant
# only for production breaks `make dev`. Profiles gate what runs, not what gets
# interpolated. Two files is the honest way to say that dev and production
# differ in topology.
#
# Operating rule 4: every extra moving part has to justify its RAM, and the
# default answer is no.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the substitution so compose leaves it for the shell inside
      # the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port on purpose. Nothing outside this network has any
    # business reaching PostgreSQL — operating rule 6, deny by default.
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${CHOREO_VERSION:-dev}
    environment:
      CHOREO_ENV: ${CHOREO_ENV:-dev}
      CHOREO_HTTP_ADDR: ":8080"
      CHOREO_LOG_LEVEL: ${CHOREO_LOG_LEVEL:-info}
      CHOREO_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Development only: the phone on the local network talks straight to the
      # server. compose.prod.yaml closes this and puts Caddy in front.
      - "${CHOREO_DEV_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
