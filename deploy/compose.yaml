name: choreo

# One PostgreSQL, one server, one reverse proxy. Operating rule 4: every extra
# moving part has to justify its RAM, and the default answer is no.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the substitution so compose leaves it for the shell inside
      # the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port on purpose. Nothing outside this network has any
    # business reaching PostgreSQL — operating rule 6, deny by default.
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${CHOREO_VERSION:-dev}
    environment:
      CHOREO_ENV: ${CHOREO_ENV:-dev}
      CHOREO_HTTP_ADDR: ":8080"
      CHOREO_LOG_LEVEL: ${CHOREO_LOG_LEVEL:-info}
      CHOREO_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Development only: the phone on the local network talks straight to the
      # server. In production the proxy below is the only door.
      - "${CHOREO_DEV_PORT:-8080}:8080"
    restart: unless-stopped

  # Only started with `--profile prod`. It stays out of the way until there is
  # a real domain name to get a certificate for (decision D-018).
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CHOREO_DOMAIN: ${CHOREO_DOMAIN:?set it in .env before using the prod profile}
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
